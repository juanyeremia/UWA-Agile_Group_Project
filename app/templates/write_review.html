<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write Review</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/general.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/write_review.css') }}">
</head>

<body>
    <!-- Navbar injection -->
    {% include 'navbar.html' %}

    <!-- Write Review Content -->
    <main class="container-lg write-review-container d-flex gap-4">
        <!-- Movie Details -->
        <div class="write-review-movie-details">
        <img src="https://placehold.co/200x300" alt="" class="write-review-poster">
        <div class="write-review-movie-info">
            <h2 class="write-review-movie-title">Movie Title</h2>
            <p class="write-review-movie-year">2023</p>
            <p class="write-review-movie-genre">Action, Adventure</p>
            <p class="write-review-movie-rating">⭐ 8.5/10</p>
        </div>
        </div>

        <!-- Review Form -->
        <form action="{{ url_for('write_review', movie_id=movie_id) }}" method="POST" class="write-review-form d-flex flex-column gap-3">
            
            <!-- Rating -->
            <label for="rating" class="review-label">Rating</label>
            <div class="d-flex align-items-center gap-2">
                <input type="number" name="rating" min="1" max="5" placeholder="1 - 5" required="required" class="form-control rating-input">
                <span>⭐</span>
            </div>

            <!-- Review Content -->
            <label for="body" class="review-label">Review</label>
            <textarea name="body" rows="8" placeholder="Write your review here..." required class="form-control"></textarea>

            <!-- Button -->
            <div class="d-flex gap-3 mt-4">
                <button type="submit" class="btn btn-primary">Submit Review</button>
                <a href="{{ url_for('movie_detail', movie_id=movie_id) }}" class="btn btn-secondary">Cancel</a>
            </div>

        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>   
</body>
</html>
