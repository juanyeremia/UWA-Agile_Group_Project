<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/login.css">
    
    <title>Log In</title>

</head>

<body>
    <div id="navbar-placeholder"></div>

    <div class="container py-4">
        <!-- Log In Header -->
        <div class="log-in-header">
            <div class="row align-items-center g-4">
                <div class="col-md-12 d-flex flex-column profile-actions">
                    <h3 class="log-in-title-details"> Log In</h3>
                    <p class="log-in-left-text">Email:</p>    
                    <input type="email" class="form-control" placeholder="Enter email" />
                    <p class="log-in-left-text">Password:</p>
                    <input type="password" class="form-control" placeholder="Enter password" />
                    <p class="log-in-left-text"><a href="reset_password.html">Forgot your password?</a></p>
                    <div class="d-flex gap-3 mt-3">
                        <button class="outline-gold-btn flex-fill">Log In</button>
                    </div>
                    
                    <hr class="separator">
                    <p class="log-in-left-text-center">Don't have an account? <a href="sign_up.html">Sign up</a></p>


                </div>

            </div>
        </div>
        <div class="footer-space">
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
</body>


</html>
