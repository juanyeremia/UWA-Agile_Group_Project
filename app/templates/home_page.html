<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/general.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/navbar.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/home_page.css') }}"
    />
    <title>Home Page</title>
  </head>

  <body>
    <!-- Navbar injection -->
    {% include 'navbar.html' %}

    <!-- Hero Section -->
    <div class="hero-section">
      <div class="hero-content container-lg">
        <h1 class="hero-title">Track films and tv shows you've watched.</h1>
        <p class="hero-subtitle">
          Read reviews, share your opinions, and discover what to watch next.
        </p>
        <a href="../html/sign_up.html" class="btn btn-primary"
          >Sign Up - It's free!</a
        >
      </div>
    </div>

    <!-- Latest Movies Section -->
    <section class="movies-section">
      <div class="container-lg">
        <h2 class="section-title">Latest Movies</h2>
        <div id="latest-movies-container" class="row row-cols-2 row-cols-md-3 row-cols-lg-6 g-3">
        </div>
      </div>
    </section>

    <!-- Highest Rated Movies Section -->
    <section class="movies-section">
      <div class="container-lg">
        <h2 class="section-title">Highest Rated Movies</h2>
        <div id="highest-rated-movies-container" class="row row-cols-2 row-cols-md-3 row-cols-lg-6 g-3">
        </div>
      </div>
    </section>

    <!-- Most recent reviews -->
    <section class="reviews-section">
      <div class="container-lg">
        <h2 class="section-title">Most Recent Reviews</h2>
        <div class="reviews-list" id="recent-reviews-container"></div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
