<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #0d0d0d;
            color: white;
            font-family: Arial, sans-serif;
        }
        
        .edit-container {
            max-width: 700px;
            margin: 80px auto;
            background: #1b1b1b;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid #2d2d2d;
            box-shadow: 0 0 30px rgba(255, 196, 0, 0.08);
        }
        
        .edit-title {
            color: #f5c518;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        .form-label {
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .form-control {
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 14px;
            border-radius: 12px;
        }
        
        .form-control:focus {
            background: #2a2a2a;
            color: white;
            border-color: #f5c518;
            box-shadow: none;
        }
        
        .save-btn {
            background: #f5c518;
            color: black;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }
        
        .save-btn:hover {
            background: #ffd84d;
        }
        
        .cancel-btn {
            border: 2px solid #f5c518;
            color: #f5c518;
            padding: 10px 28px;
            border-radius: 50px;
            text-decoration: none;
            margin-left: 12px;
            transition: 0.3s;
        }
        
        .cancel-btn:hover {
            background: #f5c518;
            color: black;
        }
        
        .profile-preview {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .profile-preview img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #f5c518;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div class="edit-container">

        <div class="profile-preview">
            <img src="https://i.pravatar.cc/300" alt="profile">
        </div>

        <h1 class="edit-title">Edit Profile</h1>

        <form method="POST">

            <div class="mb-4">
                <label class="form-label">Username</label>

                <input type="text" class="form-control" name="username" value="{{ user.username }}">
            </div>

            <div class="mb-4">
                <label class="form-label">Email</label>

                <input type="email" class="form-control" name="email" value="{{ user.email }}">
            </div>

            <div class="mb-4">
                <label class="form-label">Bio</label>

                <textarea class="form-control" rows="4" name="bio" placeholder="Tell something about yourself..."></textarea>
            </div>

            <button type="submit" class="save-btn">
                Save Changes
            </button>

            <a href="{{ url_for('profile') }}" class="cancel-btn">
                Cancel
            </a>

        </form>

    </div>

</body>

</html>
