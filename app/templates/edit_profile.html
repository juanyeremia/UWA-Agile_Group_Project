<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #0d0d0d;
            color: white;
            font-family: Arial, sans-serif;
        }
        
        .edit-container {
            max-width: 700px;
            margin: 80px auto;
            background: #1b1b1b;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid #2d2d2d;
        }
        
        .title {
            color: #f5c518;
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        .form-control {
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 14px;
            border-radius: 12px;
        }
        
        .form-control:focus {
            background: #2a2a2a;
            color: white;
            border-color: #f5c518;
            box-shadow: none;
        }
        
        .profile-preview {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .profile-preview img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #f5c518;
        }
        
        .save-btn {
            background: #f5c518;
            color: black;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: bold;
        }
        
        .cancel-btn {
            border: 2px solid #f5c518;
            color: #f5c518;
            padding: 10px 28px;
            border-radius: 50px;
            text-decoration: none;
            margin-left: 12px;
        }
        
        .help-text {
            color: #bdbdbd;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <div class="edit-container">

        <div class="profile-preview">
            <img src="{{ url_for('static', filename='profile_images/' + user.profile_image) }}" alt="profile">
        </div>

        <h1 class="title">Edit Profile</h1>

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-4">
                <label class="mb-2">Username</label>
                <input type="text" name="username" value="{{ user.username }}" class="form-control">
            </div>

            <div class="mb-4">
                <label class="mb-2">Email</label>
                <input type="email" name="email" value="{{ user.email }}" class="form-control">
            </div>

            <div class="mb-4">
                <label class="mb-2">Bio</label>
                <textarea name="bio" rows="4" class="form-control">{{ user.bio }}</textarea>
            </div>

            <div class="mb-4">
                <label class="mb-2">Upload Profile Image</label>

                <input type="file" name="profile_image" class="form-control" accept="image/png, image/jpeg, image/jpg, image/webp">

                <p class="help-text">
                    Only PNG, JPG, JPEG, or WEBP images are allowed.
                </p>
            </div>

            <button type="submit" class="save-btn">
                Save Changes
            </button>

            <a href="{{ url_for('main.profile') }}" class="cancel-btn">
                Cancel
            </a>

        </form>

    </div>

</body>

</html>
