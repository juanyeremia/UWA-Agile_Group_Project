<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write Review</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/general.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/write_review.css">
</head>
<body>
  <!-- Navbar injection -->
  <div id="navbar-placeholder"></div>

  <!-- Write Review Content -->
  <main class="container-lg write-review-container d-flex gap-4 ">
    <!-- Movie Details -->
    <div class="write-review-movie-details">
      <img src="https://placehold.co/200x300" alt="" class="write-review-poster">
      <div class="write-review-movie-info">
        <h2 class="write-review-movie-title">Movie Title</h2>
        <p class="write-review-movie-year">2023</p>
        <p class="write-review-movie-genre">Action, Adventure</p>
        <p class="write-review-movie-rating">⭐ 8.5/10</p>
      </div>
    </div>

    <!-- Review Form -->
    <div class="write-review-form">

    </div>
  </main>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>   
</body>
</html>
